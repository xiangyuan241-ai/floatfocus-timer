<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FloatFocus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="card" data-state="idle">
    <div class="drag-layer" title="按住拖动计时器" aria-hidden="true"></div>

    <div class="topbar">
      <div class="brand">
        <div class="drag-dots" title="按住拖动计时器" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="title">Focus Timer</div>
      </div>

      <div class="top-actions no-drag">
        <button class="icon-btn" id="btn-pin" title="切换点击穿透 (Ctrl+Shift+T)">
          <svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 4h6l-1 7 3 3v2H7v-2l3-3L9 4Z"/>
            <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 16v5"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-menu" title="更多设置">
          <svg viewBox="0 0 24 24" width="29" height="29" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M4 8h9M17 8h3M4 16h3M11 16h9"/>
            <circle cx="15" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="9" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="2.4"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Click-through lock indicator: shown only when click-through is ON -->
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="11" height="11"><path fill="currentColor" d="M8 1a3 3 0 0 0-3 3v2H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1V4a3 3 0 0 0-3-3Zm-2 5V4a2 2 0 1 1 4 0v2H6Z"/></svg>
    </div>

    <!-- Big time display. Double-click toggles play/pause. -->
    <div class="time" id="time">25:00</div>

    <div class="bottom-panel no-drag">
      <div class="presets" aria-label="Preset durations">
        <button class="preset is-active" type="button" data-preset="25">25m</button>
        <button class="preset" type="button" data-preset="5">5m</button>
        <button class="preset" type="button" data-preset="30">30m</button>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="controls" id="controls">
        <button class="btn" id="btn-play" title="开始">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M7 4.8v14.4c0 1 .9 1.6 1.8 1.1l11-7.2c.8-.5.8-1.7 0-2.2l-11-7.2C7.9 3.2 7 3.8 7 4.8Z"/></svg>
        </button>
        <button class="btn" id="btn-pause" title="暂停">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M7 4h3.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H7c-.8 0-1.5-.7-1.5-1.5v-13C5.5 4.7 6.2 4 7 4Zm6.5 1.5c0-.8.7-1.5 1.5-1.5h3.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H15c-.8 0-1.5-.7-1.5-1.5v-13Z"/></svg>
        </button>
        <button class="btn" id="btn-reset" title="重置">
          <svg viewBox="0 0 24 24" width="33" height="33" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M7.2 7.4A7 7 0 1 1 5 12.5"/>
            <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 5.5v5h5"/>
          </svg>
        </button>
        <button class="btn" id="btn-through" title="切换点击穿透 (Ctrl+Shift+T)">
          <svg viewBox="0 0 24 24" width="33" height="33" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M18 6a7 7 0 0 1 0 12"/>
            <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5" d="M15 20a8 8 0 0 1-7.7-3.8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Slim progress bar at the bottom edge -->
    <div class="progress"><div class="progress-fill" id="progress"></div></div>
  </div>

  <!-- "Done" toast layer -->
  <div class="toast" id="toast">
    <div class="toast-title">时间到</div>
    <div class="toast-sub">休息一下</div>
  </div>

  <div class="duration-editor no-drag" id="duration-editor" aria-hidden="true">
    <label for="duration-input">分钟</label>
    <div class="duration-row">
      <input id="duration-input" type="number" min="1" max="999" step="1" value="25" />
      <button id="duration-ok">确定</button>
      <button id="duration-cancel">取消</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
